<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="صفحه نمایش شیشه‌ای">
	<title>صفحه نمایش شیشه‌ای</title>
	<defs>
		<linearGradient id="glassDark" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b1226"/>
			<stop offset="0.5" stop-color="#05070f"/>
			<stop offset="1" stop-color="#131a33"/>
		</linearGradient>
		<linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#e8f6ff" stop-opacity="0.42"/>
			<stop offset="0.55" stop-color="#8be9ff" stop-opacity="0.10"/>
			<stop offset="1" stop-color="#8be9ff" stop-opacity="0"/>
		</linearGradient>
		<radialGradient id="glassHalo" cx="0.5" cy="0.45" r="0.72">
			<stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
			<stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#000000" stop-opacity="0"/>
		</radialGradient>
		<pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
			<path d="M16 0H0v16" fill="none" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="1"/>
		</pattern>
	</defs>

	<rect x="70" y="62" width="660" height="356" rx="10" fill="url(#glassDark)"/>
	<rect x="70" y="62" width="660" height="356" rx="10" fill="url(#pixelGrid)"/>
	<rect x="70" y="62" width="660" height="356" rx="10" fill="url(#glassHalo)"/>
	<polygon points="70,418 330,62 470,62 210,418" fill="url(#glassShine)"/>
	<rect x="70" y="62" width="660" height="356" rx="10" fill="none" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="2"/>

	<g stroke="#a855f7" stroke-opacity="0.55" stroke-width="3" fill="none">
		<path d="M540 96v288"/>
		<path d="M576 96v288"/>
	</g>
	<g fill="#f8fafc" fill-opacity="0.55">
		<rect x="96" y="88" width="120" height="8" rx="4"/>
		<rect x="96" y="108" width="72" height="8" rx="4"/>
	</g>
	<rect x="70" y="424" width="660" height="10" rx="5" fill="#1e293b"/>
