<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="قاب رویی تلویزیون">
	<title>قاب رویی تلویزیون</title>
	<defs>
		<linearGradient id="frameMetal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#3f4a5f"/>
			<stop offset="0.45" stop-color="#1b2233"/>
			<stop offset="1" stop-color="#0b1120"/>
		</linearGradient>
		<linearGradient id="frameEdge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#8fa3c4" stop-opacity="0.85"/>
			<stop offset="1" stop-color="#8fa3c4" stop-opacity="0.12"/>
		</linearGradient>
		<filter id="frameGlow" x="-25%" y="-25%" width="150%" height="150%">
			<feGaussianBlur stdDeviation="9" result="b"/>
			<feMerge>
				<feMergeNode in="b"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<rect x="34" y="26" width="732" height="428" rx="22" fill="url(#frameMetal)" stroke="url(#frameEdge)" stroke-width="3"/>
	<rect x="66" y="58" width="668" height="364" rx="12" fill="#05080f" opacity="0.92"/>
	<rect x="66" y="58" width="668" height="364" rx="12" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2"/>

	<g fill="#94a3b8" fill-opacity="0.72">
		<circle cx="52" cy="44" r="5"/>
		<circle cx="748" cy="44" r="5"/>
		<circle cx="52" cy="436" r="5"/>
		<circle cx="748" cy="436" r="5"/>
	</g>

	<g filter="url(#frameGlow)">
		<rect x="352" y="432" width="96" height="12" rx="6" fill="#22d3ee" fill-opacity="0.75"/>
	</g>
	<rect x="300" y="462" width="200" height="14" rx="7" fill="#111a2c" stroke="#334155" stroke-width="1.5"/>
</svg>
